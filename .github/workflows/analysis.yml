name: Analisi

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Ticker Yahoo separati da virgola (es. ^GSPC, ISP.MI, AAPL)"
        required: true
        default: "^GSPC"

permissions:
  contents: write

concurrency:
  group: state-writers
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Analisi
        env:
          TICKERS: ${{ inputs.tickers }}
        run: |
          IFS=',' read -ra LIST <<< "$TICKERS"
          for t in "${LIST[@]}"; do
            t="$(echo "$t" | xargs)"
            [ -n "$t" ] && python analyze.py "$t"
          done

      - name: Commit results
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/analysis
          git diff --cached --quiet || git commit -m "Aggiorna analisi"
          git pull --rebase && git push
